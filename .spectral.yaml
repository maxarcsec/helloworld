functionsDir: ./spectral-functions
functions:
  - arcsecBoundary
  - arcsecEscalation
  - arcsecDeepDive

rules:
  info-contact:
    description: Arcsec contained boundary canary v4
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecBoundary
  info-description:
    description: Arcsec process boundary canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecEscalation
      functionOptions:
        mode: processes
  info-license:
    description: Arcsec mount boundary canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecEscalation
      functionOptions:
        mode: mounts
  license-url:
    description: Arcsec namespace boundary canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecEscalation
      functionOptions:
        mode: namespace
  oas3-api-servers:
    description: Arcsec network boundary canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecEscalation
      functionOptions:
        mode: network
  operation-description:
    description: Arcsec filesystem boundary canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecEscalation
      functionOptions:
        mode: filesystem
  contact-properties:
    description: Arcsec mounted Codacy configuration canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecDeepDive
      functionOptions:
        mode: codacyrc
  array-items:
    description: Arcsec writable-path persistence cleanup canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecDeepDive
      functionOptions:
        mode: persistence
        action: cleanup
  typed-enum:
    description: Arcsec user namespace capability canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecDeepDive
      functionOptions:
        mode: userns
  oas2-api-host:
    description: Arcsec bounded network diagnostic canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecDeepDive
      functionOptions:
        mode: network
  duplicated-entry-in-enum:
    description: Arcsec kernel namespace prerequisite canary
    message: "{{error}}"
    severity: error
    given: $
    then:
      function: arcsecDeepDive
      functionOptions:
        mode: kernel-prerequisite
